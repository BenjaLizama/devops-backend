name: Build and Deploy MS Venta

on:
  push:
    branches:
      - deploy
    paths:
      - 'API-REST-VENTA/**'
      - '.github/workflows/deploy-venta.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build ms-venta
        working-directory: ./API-REST-VENTA
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./API-REST-VENTA
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ms-venta:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ms-venta:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Desplegar MS Venta vía AWS SSM
        uses: aws-actions/aws-ssm-send-command@v2
        with:
          instance-ids: ${{ secrets.AWS_INSTANCE_ID }}
          working-directory: /home/ubuntu
          comment: "Desplegando MS Venta"
          command: |
            docker compose pull ms-venta
            docker compose up -d ms-venta
            docker image prune -f