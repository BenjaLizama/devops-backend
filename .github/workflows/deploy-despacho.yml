name: Build and Deploy MS Despacho

on:
  push:
    branches:
      - deploy
    paths:
      - 'API-REST-DESPACHO/**'
      - '.github/workflows/deploy-despacho.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build ms-despacho
        working-directory: ./API-REST-DESPACHO
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        working-directory: ./API-REST-DESPACHO
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ms-despacho:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ms-despacho:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Desplegar vía AWS SSM
        uses: peterkimzz/aws-ssm-command@v2.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          instance-ids: ${{ secrets.AWS_INSTANCE_ID }}
          working-directory: /home/ubuntu
          comment: "Desplegando actualización de microservicio"
          command: |
            docker compose pull ms-venta
            docker compose up -d ms-venta
            docker image prune -f