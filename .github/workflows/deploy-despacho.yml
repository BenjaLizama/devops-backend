name: Build and Deploy MS Despacho to EKS

on:
  push:
    branches:
      - deploy
    paths:
      - 'API-REST-DESPACHO/**'
      - '.github/workflows/deploy-despacho.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Mantiene la compilación de tu proyecto Java
      - name: Build ms-despacho
        working-directory: ./API-REST-DESPACHO
        run: mvn clean package -DskipTests

      # 1. Autenticarse en AWS usando los secrets de tu AWS Academy Labs
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crítico para ambientes Sandbox/Academy
          aws-region: us-east-1

      # 2. Login automático en tu Amazon ECR (Reemplaza a Docker Hub)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Construir la imagen apuntando a la URI de AWS ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # IMPORTANTE: Si creaste un repositorio llamado 'ms-despacho' en ECR, déjalo así.
          # Si estás reutilizando los de la plantilla, puedes usar 'tienda-frontend' o similar.
          ECR_REPOSITORY: ms-despacho
          IMAGE_TAG: latest
        working-directory: ./API-REST-DESPACHO
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout del código (Para leer tus archivos .yaml)
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 4. Conectarse al clúster EKS creado por el template de la institución
      - name: Actualizar Kubeconfig para EKS
        run: |
          aws eks update-kubeconfig --name devopseks --region us-east-1

      # 5. Aplicar los manifiestos de Kubernetes para actualizar tus Pods en las instancias
      - name: Desplegar en EKS
        run: |
          kubectl apply -f k8s/despacho-deployment.yaml
          kubectl rollout restart deployment/ms-despacho-deployment