services:

  mysql:
    image: mysql:8

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - app-network

  ms-despacho:
    build:
      context: ./API-REST-DESPACHO

    container_name: ms_despacho

    restart: always

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/despacho_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    ports:
      - "8080:8080"

    networks:
      - app-network

  ms-venta:
    build:
      context: ./API-REST-VENTA

    container_name: ms_venta

    restart: always

    depends_on:
      - mysql

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/venta_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    ports:
      - "8081:8080"

    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge